# OrchestAI Configuration

# Planner Model Architecture
planner:
  instruction_encoder:
    model_name: "t5-base"  # or "bert-base-uncased"
    hidden_size: 768
    max_length: 512
    
  task_decomposer:
    hidden_size: 512
    num_layers: 3
    dropout: 0.1
    
  workflow_graph_generator:
    gnn_type: "GCN"  # GCN, GAT, or GraphSAGE
    num_layers: 3
    hidden_dim: 256
    output_dim: 128
    dropout: 0.1
    
  model_selector:
    state_dim: 512
    action_dim: 9  # number of worker types (routing_mode=type_only)
    hidden_dims: [256, 128]
    dropout: 0.1

# Worker Models
worker_models:
  - name: "gpt-4"
    model_type: "llm"
    cost_per_token: 0.03
    latency_ms: 500
    
  - name: "gpt-3.5-turbo"
    model_type: "llm"
    cost_per_token: 0.002
    latency_ms: 200
    
  - name: "llama-3-8b"
    model_type: "llm"
    cost_per_token: 0.001
    latency_ms: 300
    
  - name: "clip-vit-base"
    model_type: "vision"
    cost_per_token: 0.001
    latency_ms: 150
    
  - name: "whisper-base"
    model_type: "audio"
    cost_per_token: 0.001
    latency_ms: 250
    
  - name: "code-llama-7b"
    model_type: "code"
    cost_per_token: 0.001
    latency_ms: 400
    
  - name: "document-processor"
    model_type: "document"
    cost_per_token: 0.0005
    latency_ms: 100
    
  - name: "data-analyzer"
    model_type: "data"
    cost_per_token: 0.0005
    latency_ms: 200
  - name: "presentation-builder"
    model_type: "presentation"
    cost_per_token: 0.002
    latency_ms: 350

# Worker routing (user-mappable)
# The planner selects a worker type (action index) and the system derives a level
# from task complexity (1-5). Users can map multiple models to each level.
worker_routing:
  routing_mode: "type_only"  # type_only or type_level
  levels: 5
  types:
    - "text"
    - "voice"
    - "analytics"
    - "video"
    - "audio"
    - "vision"
    - "code"
    - "document"
    - "presentation"
  mapping:
    text:
      1: ["gpt-3.5-turbo"]
      2: ["gpt-3.5-turbo", "llama-3-8b"]
      3: ["llama-3-8b", "gpt-3.5-turbo"]
      4: ["gpt-4"]
      5: ["gpt-4"]
    voice:
      1: ["whisper-base"]
      2: ["whisper-base"]
      3: ["whisper-base"]
      4: ["whisper-base"]
      5: ["whisper-base"]
    analytics:
      1: ["data-analyzer"]
      2: ["data-analyzer"]
      3: ["data-analyzer"]
      4: ["data-analyzer"]
      5: ["data-analyzer"]
    video:
      1: ["clip-vit-base"]
      2: ["clip-vit-base"]
      3: ["clip-vit-base"]
      4: ["clip-vit-base"]
      5: ["clip-vit-base"]
    audio:
      1: ["whisper-base"]
      2: ["whisper-base"]
      3: ["whisper-base"]
      4: ["whisper-base"]
      5: ["whisper-base"]
    vision:
      1: ["clip-vit-base"]
      2: ["clip-vit-base"]
      3: ["clip-vit-base"]
      4: ["clip-vit-base"]
      5: ["clip-vit-base"]
    code:
      1: ["code-llama-7b"]
      2: ["code-llama-7b"]
      3: ["code-llama-7b"]
      4: ["code-llama-7b"]
      5: ["code-llama-7b"]
    document:
      1: ["document-processor"]
      2: ["document-processor"]
      3: ["document-processor"]
      4: ["document-processor"]
      5: ["document-processor"]
    presentation:
      1: ["presentation-builder"]
      2: ["presentation-builder"]
      3: ["presentation-builder"]
      4: ["presentation-builder"]
      5: ["presentation-builder"]
  # Optional keyword routing for rule-based simulation in GUI
  keywords:
    presentation: ["presentation", "slides", "deck"]
    video: ["video", "animation", "clip", "movie"]
    vision: ["image", "picture", "photo", "render"]
    audio: ["audio", "sound", "music"]
    voice: ["voice", "speech", "transcribe"]
    analytics: ["analyze", "analysis", "data", "chart", "plot"]
    document: ["document", "report", "pdf", "doc"]
    code: ["code", "script", "program", "bug"]

# Training Configuration
training:
  phase1_supervised:
    batch_size: 32
    learning_rate: 1e-4
    num_epochs: 50
    lambda_dag: 0.3  # DAG validity constraint weight
    train_data_size: 1000  # Target: 500-1000 examples for stronger Phase 1
    synthetic_augmentations: 1000
    
  phase2_rl:
    algorithm: "PPO"
    learning_rate: 3e-5
    num_episodes: 1000
    max_steps_per_episode: 50
    gamma: 0.99
    epsilon: 0.2  # exploration rate
    alpha: 10.0  # success reward weight
    beta: 0.1    # cost penalty weight
    gamma_latency: 0.01  # latency penalty weight
    shaped_reward: 0.1  # reward per successful sub-task
    
  phase3_continuous:
    online_learning: true
    update_frequency: 100  # update every N executions
    learning_rate: 1e-5

# Evaluation
evaluation:
  benchmark_tasks:
    - "presentation_generation"
    - "data_analysis"
    - "content_summarization"
    - "document_processing"
    - "multimodal_creation"
  
  metrics:
    - "task_success_rate"
    - "cost_efficiency"
    - "latency"
    - "workflow_validity"

# System Configuration
system:
  max_workflow_depth: 10
  max_parallel_tasks: 5
  timeout_seconds: 300
  output_schema: "json"
  log_level: "INFO"

